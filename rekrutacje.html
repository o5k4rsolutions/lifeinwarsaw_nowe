<!DOCTYPE html>
<html lang="pl" id="html-root" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktualne Rekrutacje | Life in Warsaw</title>
    <link rel="icon" type="image/x-icon" href="liw-content/liw_zakoch-2.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brandRed: '#ff334b',
                        brandRedHover: '#e61e38',
                        brandDark: '#0a0b10',
                        brandCard: '#13151f',
                        brandBorder: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
        .dark body { background-color: #0a0b10; color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(0, 0, 0, 0.08); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05); }
        .dark .glass-panel { background: rgba(19, 21, 31, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .dark .glass-card { background: rgba(19, 21, 31, 0.9); border: 1px solid rgba(255, 255, 255, 0.07); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        .glass-card:hover { transform: translateY(-4px); border-color: rgba(255, 51, 75, 0.4); box-shadow: 0 20px 40px rgba(255, 51, 75, 0.12); }
        .cyber-button { position: relative; background: linear-gradient(135deg, #ff334b 0%, #c91830 100%); color: #ffffff; font-weight: 600; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 28px; font-size: 15px; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; overflow: hidden; box-shadow: 0 10px 25px rgba(255, 51, 75, 0.3); transition: all 0.3s ease; }
        .cyber-button:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(255, 51, 75, 0.5); }
        .glow-orb { position: absolute; width: 450px; height: 450px; background: radial-gradient(circle, rgba(255, 51, 75, 0.08) 0%, rgba(248, 250, 252, 0) 70%); border-radius: 50%; z-index: 0; pointer-events: none; }
        .dark .glow-orb { background: radial-gradient(circle, rgba(255, 51, 75, 0.12) 0%, rgba(10, 11, 16, 0) 70%); }
        #bus-overlay { position: fixed; inset: 0; z-index: 99999; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; transition: opacity 0.8s ease; }
        .dark #bus-overlay { background-color: #0a0b10; }
        #bus-overlay.fade-out { opacity: 0; pointer-events: none; }
        .loader-rings { width: 60px; height: 60px; border: 3px solid rgba(0, 0, 0, 0.1); border-top: 3px solid #ff334b; border-radius: 50%; animation: spinRing 1s linear infinite; }
        .dark .loader-rings { border: 3px solid rgba(255, 255, 255, 0.1); border-top: 3px solid #ff334b; }
        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .fade-in { animation: fadeInAnim 0.4s ease forwards; }
        @keyframes fadeInAnim { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brandRed selection:text-white">

    <div id="bus-overlay">
        <img id="overlay-logo" src="https://liw-roblox.vercel.app/liw-content/image-3.svg" alt="Life in Warsaw Logo" class="h-16 w-auto filter brightness-0 contrast-200">
        <div class="loader-rings"></div>
        <div class="text-xs font-semibold uppercase tracking-widest text-zinc-500 animate-pulse">Ładowanie...</div>
    </div>

    <header class="w-full sticky top-0 z-50 bg-gradient-to-r from-red-600 via-brandRed to-rose-600 shadow-lg border-b border-red-500/30">
        <div class="max-w-[1300px] mx-auto px-6 py-4 flex justify-between items-center">
            <a href="https://lifeinwarsaw.vercel.app" class="nav-link flex items-center group">
                <img src="https://liw-roblox.vercel.app/liw-content/image-3.svg" alt="Life in Warsaw Logo" class="h-12 md:h-14 w-auto transition-transform duration-300 group-hover:scale-105 filter brightness-200">
            </a>
            <div class="flex items-center gap-3 md:gap-4">
                <a href="https://lifeinwarsaw.vercel.app" class="nav-link text-xs md:text-sm font-semibold text-white/90 hover:text-white transition py-2 px-4 rounded-lg hover:bg-white/15">Strona główna</a>
            </div>
        </div>
    </header>

    <main class="flex-grow relative py-12 md:py-16">
        <div class="glow-orb top-10 left-10"></div>
        <div class="glow-orb bottom-10 right-10"></div>

        <div class="max-w-4xl mx-auto px-6 relative z-10" id="app-container">
            <!-- Zawartość dynamiczna generowana przez JS -->
        </div>
    </main>

    <footer class="bg-slate-100 dark:bg-zinc-900 text-zinc-500 py-6 text-xs border-t border-black/5 dark:border-white/5 transition-colors">
        <div class="max-w-[1300px] mx-auto px-6 flex flex-col md:flex-row justify-between items-center text-center md:text-left gap-4">
            <p>&copy; 2026 Life in Warsaw. Wszelkie prawa zastrzeżone.</p>
            <p class="text-zinc-600 dark:text-zinc-400">UWAGA! Ta strona nie jest oficjalną stroną WTP ani ZTM.</p>
        </div>
    </footer>

    <!-- Wczytanie zakodowanego pliku danych rekrutacji -->
    <script src="r-data-v1.js"></script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const overlay = document.getElementById('bus-overlay');
                if (overlay) overlay.classList.add('fade-out');
            }, 600);

            router();
            window.addEventListener('popstate', router);
        });

        function router() {
            const path = window.location.pathname;
            // Sprawdzenie routingu w formacie /id/datautworzenia/tytuł lub dopasowanie query
            const parts = path.split('/').filter(Boolean);
            
            // Przykładowy URL: /rekrutacje.html/suport/... lub bez pliku html w katalogach czystych
            // Szukamy ID rekrutacji w ścieżce
            let recruitmentId = null;
            if (parts.length >= 2 && parts[parts.length - 3]) {
                recruitmentId = parts[parts.length - 3];
            } else {
                // Fallback do URL Search Params jeśli brak czystego routingu
                const urlParams = new URLSearchParams(window.location.search);
                recruitmentId = urlParams.get('id');
            }

            const container = document.getElementById('app-container');
            container.innerHTML = '';

            if (recruitmentId && typeof RECRUITMENT_CONFIG !== 'undefined') {
                const item = RECRUITMENT_CONFIG.items.find(r => r.id === recruitmentId);
                if (item) {
                    renderApplicationForm(item, container);
                    return;
                }
            }

            renderRecruitmentList(container);
        }

        function navigateTo(url) {
            const overlay = document.getElementById('bus-overlay');
            if (overlay) overlay.classList.remove('fade-out');
            setTimeout(() => {
                window.history.pushState({}, '', url);
                router();
                if (overlay) overlay.classList.add('fade-out');
            }, 500);
        }

        function renderRecruitmentList(container) {
            let html = `
                <div class="text-center mb-12 fade-in">
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4">Aktualne Rekrutacje</h1>
                    <p class="text-zinc-600 dark:text-zinc-400 text-base md:text-lg max-w-2xl mx-auto leading-relaxed">
                        Wybierz interesujące Cię stanowisko, zapoznaj się z wymaganiami i wyślij swoje zgłoszenie do naszego zespołu.
                    </p>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6 fade-in">
            `;

            if (typeof RECRUITMENT_CONFIG === 'undefined' || !RECRUITMENT_CONFIG.items.length) {
                html += `<div class="col-span-2 text-center py-12 text-zinc-500">Brak aktywnych rekrutacji w tej chwili.</div>`;
            } else {
                RECRUITMENT_CONFIG.items.forEach(item => {
                    const slugTitle = item.title.replace(/\s+/g, '-').toLowerCase();
                    const cleanUrl = `${item.id}/${item.createdAt}/${slugTitle}`;
                    html += `
                        <div class="glass-card rounded-2xl p-6 md:p-8 flex flex-col justify-between">
                            <div>
                                <div class="flex items-center justify-between mb-4">
                                    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-brandRed/10 text-brandRed border border-brandRed/20">Otwarta</span>
                                    <span class="text-xs text-zinc-500"><i class="fa-regular fa-calendar mr-1"></i> ${item.createdAt}</span>
                                </div>
                                <h3 class="text-xl font-bold mb-2">${item.title}</h3>
                                <p class="text-sm text-zinc-600 dark:text-zinc-400 mb-6 leading-relaxed">${item.description}</p>
                            </div>
                            <button onclick="navigateTo('${cleanUrl}')" class="cyber-button w-full text-center">
                                <span class="flex items-center justify-center gap-2">Aplikuj teraz <i class="fa-solid fa-arrow-right"></i></span>
                            </button>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        function renderApplicationForm(item, container) {
            let html = `
                <div class="mb-6 fade-in">
                    <button onclick="navigateTo('rekrutacje.html')" class="inline-flex items-center gap-2 text-sm font-semibold text-zinc-600 dark:text-zinc-400 hover:text-brandRed transition mb-6">
                        <i class="fa-solid fa-arrow-left"></i> Powrót do listy rekrutacji
                    </button>
                    <div class="glass-card rounded-2xl p-6 md:p-10">
                        <div class="border-b border-zinc-200 dark:border-zinc-800 pb-6 mb-8">
                            <h1 class="text-2xl md:text-3xl font-extrabold mb-2">${item.title}</h1>
                            <p class="text-sm text-zinc-600 dark:text-zinc-400">${item.description}</p>
                        </div>

                        <form id="recruitment-form" onsubmit="handleFormSubmit(event, '${item.id}', '${item.title}')" class="space-y-6">
            `;

            // Standardowe pola systemowe
            if (item.collectEmail) {
                html += `
                    <div>
                        <label class="block text-sm font-medium mb-2">Adres E-mail <span class="text-brandRed">*</span></label>
                        <input type="email" required name="sys_email" placeholder="twoj@email.com" class="w-full bg-black/5 dark:bg-white/5 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition">
                    </div>
                `;
            }
            if (item.collectDiscord) {
                html += `
                    <div>
                        <label class="block text-sm font-medium mb-2">Nazwa użytkownika Discord <span class="text-brandRed">*</span></label>
                        <input type="text" required name="sys_discord" placeholder="np. nick#0000 lub nazwa" class="w-full bg-black/5 dark:bg-white/5 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition">
                    </div>
                `;
            }
            if (item.collectRoblox) {
                html += `
                    <div>
                        <label class="block text-sm font-medium mb-2">Nick w grze Roblox <span class="text-brandRed">*</span></label>
                        <input type="text" required name="sys_roblox" placeholder="Twój nick z Roblox" class="w-full bg-black/5 dark:bg-white/5 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition">
                    </div>
                `;
            }

            // Pytania dynamiczne
            item.questions.forEach((q, index) => {
                html += `<div class="pt-4 border-t border-zinc-200 dark:border-zinc-800/60">`;
                html += `<label class="block text-sm font-medium mb-2">${index + 1}. ${q.label} ${q.required ? '<span class="text-brandRed">*</span>' : ''}</label>`;

                if (q.type === 'short') {
                    html += `<input type="text" ${q.required ? 'required' : ''} name="${q.id}" class="w-full bg-black/5 dark:bg-white/5 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition">`;
                } else if (q.type === 'long') {
                    html += `<textarea rows="4" ${q.required ? 'required' : ''} name="${q.id}" class="w-full bg-black/5 dark:bg-white/5 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition resize-none"></textarea>`;
                } else if (q.type === 'choice') {
                    html += `<div class="space-y-2">`;
                    q.options.forEach((opt, oIdx) => {
                        html += `
                            <label class="flex items-center gap-3 p-3 rounded-xl bg-black/5 dark:bg-white/5 border border-zinc-200 dark:border-zinc-800 cursor-pointer hover:border-brandRed transition">
                                <input type="radio" name="${q.id}" value="${opt}" ${oIdx === 0 && q.required ? 'required' : ''} class="text-brandRed focus:ring-brandRed">
                                <span class="text-sm">${opt}</span>
                            </label>
                        `;
                    });
                    html += `</div>`;
                } else if (q.type === 'range') {
                    html += `
                        <div class="flex items-center gap-4">
                            <input type="range" min="${q.min}" max="${q.max}" step="${q.step || 1}" value="${q.min}" name="${q.id}" oninput="this.nextElementSibling.innerText = this.value" class="w-full accent-brandRed cursor-pointer">
                            <span class="font-bold text-brandRed w-8 text-center">${q.min}</span>
                        </div>
                    `;
                } else if (q.type === 'file') {
                    html += `
                        <input type="file" ${q.required ? 'required' : ''} accept="${q.accept || '*'}" name="${q.id}" class="w-full text-sm text-zinc-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-brandRed file:text-white hover:file:bg-brandRedHover file:cursor-pointer cursor-pointer">
                    `;
                }
                html += `</div>`;
            });

            html += `
                            <div class="pt-6">
                                <button type="submit" id="submit-btn" class="cyber-button w-full">
                                    <span class="flex items-center justify-center gap-2">Wyślij zgłoszenie <i class="fa-solid fa-paper-plane"></i></span>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>
            `;
            container.innerHTML = html;
        }

        async function handleFormSubmit(event, recruitmentId, recruitmentTitle) {
            event.preventDefault();
            const form = event.target;
            const submitBtn = document.getElementById('submit-btn');
            submitBtn.disabled = true;
            submitBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> Wysyłanie zgłoszenia...`;

            const formData = new FormData(form);
            const dataObj = {};
            const filesObj = {};

            for (let [key, value] of formData.entries()) {
                if (value instanceof File && value.size > 0) {
                    filesObj[key] = value;
                } else {
                    dataObj[key] = value;
                }
            }

            const ticketId = 'LiW-' + Math.floor(100000 + Math.random() * 900000);
            const robloxUser = dataObj['sys_roblox'] || dataObj['kq1'] || 'Nie podano';
            const emailUser = dataObj['sys_email'];

            // 1. Wysyłka Emaila (Brevo API) jeśli podano e-mail
            if (emailUser && typeof RECRUITMENT_CONFIG !== 'undefined') {
                try {
                    const brevoKey = RECRUITMENT_CONFIG.brevoApiParts.join('');
                    await fetch('https://api.brevo.com/v3/smtp/email', {
                        method: 'POST',
                        headers: {
                            'accept': 'application/json',
                            'api-key': brevoKey,
                            'content-type': 'application/json'
                        },
                        body: JSON.stringify({
                            to: [{ email: emailUser }],
                            templateId: RECRUITMENT_CONFIG.brevoTemplateId,
                            params: {
                                ROBLOX_USER: robloxUser,
                                RECRUITMENT_TITLE: recruitmentTitle,
                                TICKET_ID: ticketId
                            }
                        })
                    });
                } catch (err) {
                    console.error("Błąd wysyłki email Brevo:", err);
                }
            }

            // 2. Wysyłka na Webhook Discorda
            if (typeof RECRUITMENT_CONFIG !== 'undefined') {
                try {
                    const webhookUrl = RECRUITMENT_CONFIG.webhookParts.join('');
                    const discordPayload = new FormData();
                    
                    let embedDescription = `**ID Zgłoszenia:** \`${ticketId}\`\n**Stanowisko:** ${recruitmentTitle}\n\n**Odpowiedzi:**\n`;
                    for (const [k, v] of Object.entries(dataObj)) {
                        embedDescription += `> **${k}:** ${v}\n`;
                    }

                    const payloadJson = {
                        embeds: [{
                            title: `📥 Nowe zgłoszenie rekrutacyjne: ${recruitmentTitle}`,
                            color: 16726347,
                            description: embedDescription,
                            footer: { text: "Life in Warsaw • System Rekrutacji" },
                            timestamp: new Date().toISOString()
                        }]
                    };

                    discordPayload.append('payload_json', JSON.stringify(payloadJson));

                    // Dołączenie plików do webhooka Discorda jeśli wybrano
                    let fileIndex = 0;
                    for (const [fKey, fVal] of Object.entries(filesObj)) {
                        discordPayload.append(`file${fileIndex}`, fVal, fVal.name);
                        fileIndex++;
                    }

                    await fetch(webhookUrl, {
                        method: 'POST',
                        body: discordPayload
                    });
                } catch (err) {
                    console.error("Błąd wysyłki webhook Discord:", err);
                }
            }

            // Sukces i powrót
            alert(`Twoje zgłoszenie zostało pomyślnie wysłane! Numer zgłoszenia: ${ticketId}`);
            navigateTo('rekrutacje.html');
        }
    </script>
</body>
</html>
