<!DOCTYPE html>
<html lang="pl" id="html-root" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktualne Rekrutacje | Life in Warsaw</title>
    <link rel="icon" type="image/x-icon" href="liw-content/liw_zakoch-2.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brandRed: '#ff334b',
                        brandRedHover: '#e61e38',
                        brandDark: '#0a0b10',
                        brandCard: '#13151f',
                        brandBorder: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .dark body {
            background-color: #0a0b10;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }
        .dark .glass-panel {
            background: rgba(19, 21, 31, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dark .glass-card {
            background: rgba(19, 21, 31, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 51, 75, 0.4);
            box-shadow: 0 20px 40px rgba(255, 51, 75, 0.12);
        }
        .cyber-button {
            position: relative;
            background: linear-gradient(135deg, #ff334b 0%, #c91830 100%);
            color: #ffffff;
            font-weight: 600;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            font-size: 15px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            box-shadow: 0 10px 25px rgba(255, 51, 75, 0.3);
            transition: all 0.3s ease;
        }
        .cyber-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255, 51, 75, 0.5);
        }
        .glow-orb {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 51, 75, 0.08) 0%, rgba(248, 250, 252, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .dark .glow-orb {
            background: radial-gradient(circle, rgba(255, 51, 75, 0.12) 0%, rgba(10, 11, 16, 0) 70%);
        }
        #bus-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            transition: opacity 0.8s ease;
        }
        .dark #bus-overlay { background-color: #0a0b10; }
        #bus-overlay.fade-out { opacity: 0; pointer-events: none; }
        .loader-rings {
            width: 60px; height: 60px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #ff334b;
            border-radius: 50%;
            animation: spinRing 1s linear infinite;
        }
        .dark .loader-rings { border: 3px solid rgba(255, 255, 255, 0.1); border-top: 3px solid #ff334b; }
        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        .step-transition {
            animation: fadeIn 0.4s ease forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brandRed selection:text-white">

    <div id="bus-overlay">
        <img id="overlay-logo" src="https://liw-roblox.vercel.app/liw-content/image-3.svg" alt="Life in Warsaw Logo" class="h-16 w-auto filter brightness-0 contrast-200">
        <div class="loader-rings"></div>
        <div class="text-xs font-semibold uppercase tracking-widest text-zinc-500 animate-pulse">Ładowanie...</div>
    </div>

    <header class="w-full sticky top-0 z-50 bg-gradient-to-r from-red-600 via-brandRed to-rose-600 shadow-lg border-b border-red-500/30">
        <div class="max-w-[1300px] mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="nav-link flex items-center group">
                <img src="https://liw-roblox.vercel.app/liw-content/image-3.svg" alt="Life in Warsaw Logo" class="h-12 md:h-14 w-auto transition-transform duration-300 group-hover:scale-105 filter brightness-200">
            </a>
            <div class="flex items-center gap-3 md:gap-4">
                <a href="https://lifeinwarsaw.vercel.app" class="nav-link text-xs md:text-sm font-semibold text-white/90 hover:text-white transition py-2 px-4 rounded-lg hover:bg-white/15">Strona główna</a>
            </div>
        </div>
    </header>

    <main class="flex-grow relative py-12 md:py-16">
        <div class="glow-orb top-10 left-10"></div>
        <div class="glow-orb bottom-10 right-10"></div>

        <div class="max-w-4xl mx-auto px-6 relative z-10" id="app-container">
            <div id="rekrutacje-list-view">
                <div class="text-center mb-12">
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4">Aktualne Rekrutacje</h1>
                    <p class="text-zinc-600 dark:text-zinc-400 text-base md:text-lg max-w-2xl mx-auto leading-relaxed">
                        Chcesz dołączyć do naszego zespołu lub współtworzyć projekt Life in Warsaw? Wybierz interesujące Cię stanowisko i wyślij zgłoszenie!
                    </p>
                </div>
                <div id="rekrutacje-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
            </div>

            <div id="rekrutacja-form-view" class="hidden">
                <button onclick="powrotDoListy()" class="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-zinc-500 hover:text-brandRed transition">
                    <i class="fa-solid fa-arrow-left"></i> Wróć do listy rekrutacji
                </button>
                <div class="glass-card rounded-2xl p-6 md:p-10">
                    <div id="form-header" class="mb-8 pb-6 border-b border-zinc-200 dark:border-zinc-800">
                    </div>
                    <form id="dynamic-application-form" onsubmit="wyslijFormularz(event)">
                        <div id="form-steps-container">
                        </div>
                        <div class="mt-8 flex justify-between items-center pt-6 border-t border-zinc-200 dark:border-zinc-800">
                            <button type="button" id="prev-btn" onclick="zmienKrok(-1)" class="hidden px-6 py-2.5 rounded-xl border border-zinc-300 dark:border-zinc-700 font-semibold text-sm hover:bg-zinc-100 dark:hover:bg-zinc-800 transition">Wstecz</button>
                            <button type="button" id="next-btn" onclick="zmienKrok(1)" class="cyber-button ml-auto">Dalej</button>
                            <button type="submit" id="submit-btn" class="hidden cyber-button ml-auto">Wyślij zgłoszenie</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="glass-panel border-t border-black/10 py-6 text-xs transition-colors mt-auto">
        <div class="max-w-[1300px] mx-auto px-6 text-center text-zinc-500">
            <p>&copy; 2026 Life in Warsaw. Wszelkie prawa zastrzeżone.</p>
        </div>
    </footer>

    <script src="rekrutacje.js"></script>
    <script>
        let aktualnaRekrutacja = null;
        let aktualnyKrokIndex = 0;
        let wszystkiePolaFormularza = [];

        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const overlay = document.getElementById('bus-overlay');
                if (overlay) overlay.classList.add('fade-out');
            }, 500);

            sprawdzURLIPrezentuj();
            window.addEventListener('popstate', sprawdzURLIPrezentuj);
        });

        function sprawdzURLIPrezentuj() {
            const sciezka = window.location.pathname;
            const segments = sciezka.split('/').filter(Boolean);
            
            const rekrutacjaId = segments.length >= 1 && segments[segments.length - 1] !== 'rekrutacje.html' ? segments[segments.length - 3] || segments[0] : null;

            const urlParams = new URLSearchParams(window.location.search);
            const paramId = urlParams.get('id');

            const targetId = paramId || (rekrutacjeData.some(r => r.id === rekrutacjaId) ? rekrutacjaId : null);

            if (targetId) {
                const rek = rekrutacjeData.find(r => r.id === targetId);
                if (rek) {
                    otworzFormularzRekrutacji(rek, false);
                    return;
                }
            }
            pokazListeRekrutacji(false);
        }

        function pokazListeRekrutacji(zmienHistorie = true) {
            document.getElementById('rekrutacja-form-view').classList.add('hidden');
            document.getElementById('rekrutacje-list-view').classList.remove('hidden');
            
            if (zmienHistorie) {
                history.pushState({}, '', 'rekrutacje.html');
            }

            const grid = document.getElementById('rekrutacje-grid');
            grid.innerHTML = '';

            rekrutacjeData.forEach(rek => {
                const slugTytul = rek.tytul.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl p-6 md:p-8 flex flex-col justify-between cursor-pointer';
                card.onclick = () => otworzFormularzRekrutacji(rek);
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="px-3 py-1 rounded-full bg-brandRed/10 text-brandRed text-xs font-bold">Aktywna</span>
                            <span class="text-xs text-zinc-500"><i class="fa-regular fa-calendar"></i> ${rek.dataUtworzenia}</span>
                        </div>
                        <h3 class="text-xl font-bold mb-2">${rek.tytul}</h3>
                        <p class="text-zinc-600 dark:text-zinc-400 text-sm leading-relaxed mb-6">${rek.opis}</p>
                    </div>
                    <div class="flex items-center text-brandRed font-semibold text-sm group">
                        Aplikuj teraz <i class="fa-solid fa-arrow-right ml-2 transition-transform group-hover:translate-x-1"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function otworzFormularzRekrutacji(rek, zmienHistorie = true) {
            aktualnaRekrutacja = rek;
            aktualnyKrokIndex = 0;

            if (zmienHistorie) {
                const slugTytul = rek.tytul.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                history.pushState({}, '', `${rek.id}/${rek.dataUtworzenia}/${slugTytul}`);
            }

            document.getElementById('rekrutacje-list-view').classList.add('hidden');
            document.getElementById('rekrutacja-form-view').classList.remove('hidden');

            document.getElementById('form-header').innerHTML = `
                <h2 class="text-2xl font-extrabold mb-2">${rek.tytul}</h2>
                <p class="text-zinc-600 dark:text-zinc-400 text-sm">${rek.opis}</p>
            `;

            budujPolaFormularza();
            pokazKrok(0);
        }

        function powrotDoListy() {
            pokazListeRekrutacji(true);
        }

        function budujPolaFormularza() {
            wszystkiePolaFormularza = [];

            // Pola systemowe bazowe
            if (aktualnaRekrutacja.zbierajEmail) {
                wszystkiePolaFormularza.push({ id: 'sys_email', etykieta: 'Twój Adres E-mail', typ: 'email', wymagane: true });
            }
            if (aktualnaRekrutacja.zbierajDiscord) {
                wszystkiePolaFormularza.push({ id: 'sys_discord', etykieta: 'Twój Nick Discord (np. nazwa#0000)', typ: 'krotka', wymagane: true });
            }
            if (aktualnaRekrutacja.zbierajRoblox) {
                wszystkiePolaFormularza.push({ id: 'sys_roblox', etykieta: 'Twój Nick w Roblox', typ: 'krotka', wymagane: true });
            }

            // Pytania rekrutacyjne
            aktualnaRekrutacja.pytania.forEach(p => {
                wszystkiePolaFormularza.push({ id: p.id, etykieta: p.tresc, ...p });
            });

            const container = document.getElementById('form-steps-container');
            container.innerHTML = '';

            wszystkiePolaFormularza.forEach((pole, idx) => {
                const stepDiv = document.createElement('div');
                stepDiv.className = `form-step ${idx === 0 ? '' : 'hidden'} step-transition space-y-4`;
                stepDiv.dataset.index = idx;

                let inputHtml = '';
                if (pole.typ === 'krotka' || pole.typ === 'email') {
                    inputHtml = `<input type="${pole.typ === 'email' ? 'email' : 'text'}" name="${pole.id}" required class="w-full bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition" placeholder="Wpisz odpowiedź...">`;
                } else if (pole.typ === 'dluga') {
                    inputHtml = `<textarea name="${pole.id}" rows="4" required class="w-full bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition" placeholder="Wpisz wyczerpującą odpowiedź..."></textarea>`;
                } else if (pole.typ === 'suwak') {
                    inputHtml = `
                        <div class="space-y-2">
                            <input type="range" name="${pole.id}" min="${pole.min || 1}" max="${pole.max || 10}" value="${pole.min || 1}" oninput="this.nextElementSibling.innerText = this.value" class="w-full accent-brandRed cursor-pointer">
                            <div class="text-center font-bold text-brandRed text-lg"><span>${pole.min || 1}</span></div>
                        </div>
                    `;
                } else if (pole.typ === 'wybor') {
                    inputHtml = `<div class="space-y-2">` + pole.opcje.map((opcja, oIdx) => `
                        <label class="flex items-center gap-3 p-3 rounded-xl bg-zinc-100 dark:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 cursor-pointer hover:border-brandRed transition">
                            <input type="radio" name="${pole.id}" value="${opcja}" ${oIdx === 0 ? 'checked' : ''} class="accent-brandRed">
                            <span class="text-sm font-medium">${opcja}</span>
                        </label>
                    `).join('') + `</div>`;
                } else if (pole.typ === 'plik') {
                    inputHtml = `<input type="file" name="${pole.id}" accept=".jpg,.jpeg,.png,.webp,.pdf" class="w-full text-sm text-zinc-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-brandRed file:text-white hover:file:bg-brandRedHover cursor-pointer">`;
                }

                stepDiv.innerHTML = `
                    <label class="block text-base font-bold text-zinc-800 dark:text-zinc-200 mb-2">Krok ${idx + 1} z ${wszystkiePolaFormularza.length}</label>
                    <p class="text-lg font-medium text-zinc-700 dark:text-zinc-300 mb-4">${pole.etykieta}</p>
                    ${inputHtml}
                `;
                container.appendChild(stepDiv);
            });
        }

        function pokazKrok(index) {
            const kroki = document.querySelectorAll('.form-step');
            kroki.forEach((krok, i) => {
                if (i === index) {
                    krok.classList.remove('hidden');
                } else {
                    krok.classList.add('hidden');
                }
            });

            document.getElementById('prev-btn').classList.toggle('hidden', index === 0);
            document.getElementById('next-btn').classList.toggle('hidden', index === kroki.length - 1);
            document.getElementById('submit-btn').classList.toggle('hidden', index !== kroki.length - 1);
        }

        function zmienKrok(kierunek) {
            const kroki = document.querySelectorAll('.form-step');
            const nowyIndeks = aktualnyKrokIndex + kierunek;
            if (nowyIndeks >= 0 && nowyIndeks < kroki.length) {
                aktualnyKrokIndex = nowyIndeks;
                pokazKrok(aktualnyKrokIndex);
            }
        }

        async function wyslijFormularz(e) {
    e.preventDefault();
    const form = e.target;
    const formData = new FormData(form);
    
    const ticketId = '06' + Math.floor(100000 + Math.random() * 900000);
    let emailAdres = '';
    let robloxUser = 'Brak';
    let discordUser = 'Brak';

    const odpowiedziPodsumowanie = [];
    
    const brevoParams = {
        TICKET_ID: ticketId,
        RECRUITMENT_TITLE: aktualnaRekrutacja.tytul
    };

    let pIndex = 1;
    for (let [key, value] of formData.entries()) {
        if (key === 'sys_email') {
            emailAdres = value;
            brevoParams.EMAIL = value;
        }
        if (key === 'sys_discord') {
            discordUser = value;
            brevoParams.DISCORD = value;
        }
        if (key === 'sys_roblox') {
            robloxUser = value;
            brevoParams.ROBLOX = value;
        }

        const poleObj = wszystkiePolaFormularza.find(p => p.id === key);
        const etykieta = poleObj ? poleObj.etykieta : key;
        
        let wartoscTekstowa = value;
        if (value instanceof File && value.name) {
            wartoscTekstowa = `[Załącznik plikowy: ${value.name}]`;
        }

        if (!(key.startsWith('sys_'))) {
            odpowiedziPodsumowanie.push(`• **${etykieta}**:\n${wartoscTekstowa}`);
        }

        brevoParams[`PYTANIE_${pIndex}`] = etykieta;
        brevoParams[`ODPOWIEDZ_${pIndex}`] = wartoscTekstowa;
        pIndex++;
    }

    brevoParams.EMAIL = emailAdres || 'Brak';
    brevoParams.DISCORD = discordUser;
    brevoParams.ROBLOX = robloxUser;

    const overlay = document.getElementById('bus-overlay');
    if (overlay) overlay.classList.remove('fade-out');

    try {
        if (emailAdres && typeof _cfg !== 'undefined') {
            const brevoApiKey = _cfg.b1 + _cfg.b2 + _cfg.b3;
            await fetch('https://api.brevo.com/v3/smtp/email', {
                method: 'POST',
                headers: {
                    'accept': 'application/json',
                    'api-key': brevoApiKey,
                    'content-type': 'application/json'
                },
                body: JSON.stringify({
                    sender: { name: "Life in Warsaw", email: "noreply@lifeinwarsaw.vercel.app" },
                    to: [{ email: emailAdres }],
                    templateId: _cfg.tmpl,
                    params: brevoParams
                })
            });
        }

        if (typeof _cfg !== 'undefined') {
            const webhookUrl = _cfg.wh1 + _cfg.wh2 + _cfg.wh3;
            const discordPayload = {
                content: `📥 **Nowe zgłoszenie rekrutacyjne!**\n**Stanowisko:** ${aktualnaRekrutacja.tytul}\n**ID Zgłoszenia:** \`${ticketId}\`\n**Discord:** ${discordUser}\n**Roblox:** ${robloxUser}\n**E-mail:** ${emailAdres}\n\n**Odpowiedzi:**\n${odpowiedziPodsumowanie.join('\n')}`
            };

            await fetch(webhookUrl, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify(discordPayload)
            });
        }

        alert('Twoje zgłoszenie zostało pomyślnie wysłane! Sprawdź swoją skrzynkę e-mail.');
        powrotDoListy();
    } catch (err) {
        console.error(err);
        alert('Wystąpił błąd podczas wysyłania zgłoszenia. Spróbuj ponownie.');
    } finally {
        if (overlay) overlay.classList.add('fade-out');
    }
}
    </script>
</body>
</html>
