<!DOCTYPE html>
<html lang="pl" id="html-root" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aktualne Rekrutacje | Life in Warsaw</title>
    <link rel="icon" type="image/x-icon" href="liw-content/liw_zakoch-2.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brandRed: '#ff334b',
                        brandRedHover: '#e61e38',
                        brandDark: '#0a0b10',
                        brandCard: '#13151f',
                        brandBorder: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #f8fafc; color: #0f172a; overflow-x: hidden; transition: background-color 0.4s ease, color 0.4s ease; }
        .dark body { background-color: #0a0b10; color: #f8fafc; }
        .glass-panel { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(16px); border: 1px solid rgba(0, 0, 0, 0.08); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05); }
        .dark .glass-panel { background: rgba(19, 21, 31, 0.85); border: 1px solid rgba(255, 255, 255, 0.08); box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4); }
        .glass-card { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(12px); border: 1px solid rgba(0, 0, 0, 0.06); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03); transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
        .dark .glass-card { background: rgba(19, 21, 31, 0.9); border: 1px solid rgba(255, 255, 255, 0.07); box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3); }
        .glass-card:hover { transform: translateY(-4px); border-color: rgba(255, 51, 75, 0.4); box-shadow: 0 20px 40px rgba(255, 51, 75, 0.12); }
        .cyber-button { position: relative; background: linear-gradient(135deg, #ff334b 0%, #c91830 100%); color: #ffffff; font-weight: 600; border-radius: 14px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 28px; font-size: 15px; text-decoration: none; border: 1px solid rgba(255, 255, 255, 0.2); cursor: pointer; overflow: hidden; box-shadow: 0 10px 25px rgba(255, 51, 75, 0.3); transition: all 0.3s ease; }
        .cyber-button:hover { transform: translateY(-2px); box-shadow: 0 15px 35px rgba(255, 51, 75, 0.5); }
        .glow-orb { position: absolute; width: 450px; height: 450px; background: radial-gradient(circle, rgba(255, 51, 75, 0.08) 0%, rgba(248, 250, 252, 0) 70%); border-radius: 50%; z-index: 0; pointer-events: none; }
        .dark .glow-orb { background: radial-gradient(circle, rgba(255, 51, 75, 0.12) 0%, rgba(10, 11, 16, 0) 70%); }
        #bus-overlay { position: fixed; inset: 0; z-index: 99999; background-color: #f8fafc; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; transition: opacity 0.8s ease; }
        .dark #bus-overlay { background-color: #0a0b10; }
        #bus-overlay.fade-out { opacity: 0; pointer-events: none; }
        .loader-rings { width: 60px; height: 60px; border: 3px solid rgba(0, 0, 0, 0.1); border-top: 3px solid #ff334b; border-radius: 50%; animation: spinRing 1s linear infinite; }
        .dark .loader-rings { border: 3px solid rgba(255, 255, 255, 0.1); border-top: 3px solid #ff334b; }
        @keyframes spinRing { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        #liw-toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 100000; display: flex; flex-direction: column; gap: 10px; }
        .liw-toast { background: rgba(19, 21, 31, 0.95); border: 1px solid rgba(255, 51, 75, 0.4); color: white; padding: 14px 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); display: flex; align-items: center; gap: 12px; animation: slideInToast 0.3s ease forwards; font-size: 14px; max-width: 350px; }
        @keyframes slideInToast { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brandRed selection:text-white">

    <div id="bus-overlay">
        <img id="overlay-logo" src="https://liw-roblox.vercel.app/liw-content/image-3.svg" alt="Life in Warsaw Logo" class="h-16 w-auto filter brightness-0 contrast-200">
        <div class="loader-rings"></div>
        <div class="text-xs font-semibold uppercase tracking-widest text-zinc-500 animate-pulse">Ładowanie...</div>
    </div>

    <div id="liw-toast-container"></div>

    <header class="w-full sticky top-0 z-50 bg-gradient-to-r from-red-600 via-brandRed to-rose-600 shadow-lg border-b border-red-500/30">
        <div class="max-w-[1300px] mx-auto px-6 py-4 flex justify-between items-center">
            <a href="https://lifeinwarsaw.vercel.app" class="nav-link flex items-center group">
                <img src="https://liw-roblox.vercel.app/liw-content/image-3.svg" alt="Life in Warsaw Logo" class="h-12 md:h-14 w-auto transition-transform duration-300 group-hover:scale-105 filter brightness-200">
            </a>
            <div class="flex items-center gap-3 md:gap-4">
                <a href="https://lifeinwarsaw.vercel.app" class="nav-link text-xs md:text-sm font-semibold text-white/90 hover:text-white transition py-2 px-4 rounded-lg hover:bg-white/15">Strona główna</a>
            </div>
        </div>
    </header>

    <main class="flex-grow relative py-12 md:py-16">
        <div class="glow-orb top-10 left-10"></div>
        <div class="glow-orb bottom-10 right-10"></div>

        <div class="max-w-4xl mx-auto px-6 relative z-10" id="main-container">
            <div id="recruitment-list-view">
                <div class="text-center mb-12">
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4">Aktualne Rekrutacje</h1>
                    <p class="text-zinc-600 dark:text-zinc-400 text-base md:text-lg max-w-2xl mx-auto leading-relaxed">
                        Chcesz zasilić szeregi naszego zespołu Life in Warsaw? Wybierz interesującą Cię rekrutację i wyślij zgłoszenie!
                    </p>
                </div>
                <div id="recruitment-cards-grid" class="grid grid-cols-1 md:grid-cols-2 gap-6">
                </div>
            </div>

            <div id="recruitment-form-view" class="hidden">
                <button onclick="backToList()" class="mb-6 inline-flex items-center gap-2 text-sm font-semibold text-zinc-600 dark:text-zinc-400 hover:text-brandRed transition">
                    <i class="fa-solid fa-arrow-left"></i> Wróć do listy rekrutacji
                </button>
                <div class="glass-card rounded-2xl p-6 md:p-10">
                    <div id="form-header-area" class="mb-8 pb-6 border-b border-zinc-200 dark:border-zinc-800">
                    </div>
                    <form id="dynamic-application-form" class="space-y-6" onsubmit="handleFormSubmit(event)">
                        <div id="system-fields-area" class="space-y-4 pb-6 border-b border-zinc-200 dark:border-zinc-800">
                        </div>
                        <div id="questions-area" class="space-y-6">
                        </div>
                        <div class="pt-6">
                            <button type="submit" class="cyber-button w-full justify-center">
                                <span class="flex items-center gap-2"><i class="fa-solid fa-paper-plane"></i> Wyślij zgłoszenie</span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <script>
        const configFilename = atob("cmVrcnV0YWNqZS5qcw==");
        
        const scriptTag = document.createElement('script');
        scriptTag.src = configFilename;
        scriptTag.onload = initRecruitmentApp;
        scriptTag.onerror = () => showToast("Nie udało się załadować danych rekrutacyjnych.", "error");
        document.head.appendChild(scriptTag);

        let activeRecruitment = null;

        function showToast(message, type = 'success') {
            const container = document.getElementById('liw-toast-container');
            const toast = document.createElement('div');
            toast.className = 'liw-toast';
            toast.innerHTML = `<i class="fa-solid ${type === 'success' ? 'fa-circle-check text-brandRed' : 'fa-circle-exclamation text-amber-500'} text-lg"></i><span>${message}</span>`;
            container.appendChild(toast);
            setTimeout(() => {
                toast.style.opacity = '0';
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        }

        function initRecruitmentApp() {
            if (!window.LIW_CONFIG || !window.LIW_CONFIG.list) return;
            
            window.addEventListener('popstate', handleRouting);
            handleRouting();
            
            setTimeout(() => {
                const overlay = document.getElementById('bus-overlay');
                if (overlay) overlay.classList.add('fade-out');
            }, 600);
        }

        function handleRouting() {
            const pathParts = window.location.pathname.split('/').filter(Boolean);
            const urlParams = new URLSearchParams(window.location.search);
            const queryId = urlParams.get('id');

            let targetId = null;
            if (pathParts.length >= 1 && pathParts[0] !== 'rekrutacje.html') {
                targetId = pathParts[0];
            } else if (queryId) {
                targetId = queryId;
            }

            if (targetId) {
                const found = window.LIW_CONFIG.list.find(r => r.id === targetId);
                if (found) {
                    openFormView(found, false);
                    return;
                }
            }
            showListView(false);
        }

        function showListView(pushHistory = true) {
            document.getElementById('recruitment-form-view').classList.add('hidden');
            document.getElementById('recruitment-list-view').classList.remove('hidden');
            
            if (pushHistory) {
                window.history.pushState({}, '', 'https://lifeinwarsaw.vercel.app/rekrutacje.html');
            }

            const grid = document.getElementById('recruitment-cards-grid');
            grid.innerHTML = '';

            window.LIW_CONFIG.list.forEach(item => {
                const card = document.createElement('div');
                card.className = 'glass-card rounded-2xl p-6 md:p-8 flex flex-col justify-between cursor-pointer';
                card.onclick = () => selectRecruitment(item);
                card.innerHTML = `
                    <div>
                        <div class="flex items-center justify-between mb-4">
                            <span class="text-xs font-semibold px-3 py-1 rounded-full bg-brandRed/10 text-brandRed border border-brandRed/20">Aktywna</span>
                            <span class="text-xs text-zinc-500"><i class="fa-regular fa-calendar"></i> ${item.createdAt}</span>
                        </div>
                        <h3 class="text-xl font-bold mb-2">${item.title}</h3>
                        <p class="text-sm text-zinc-600 dark:text-zinc-400 mb-6 leading-relaxed">${item.description}</p>
                    </div>
                    <div class="flex items-center gap-2 text-sm font-semibold text-brandRed">
                        <span>Aplikuj teraz</span> <i class="fa-solid fa-arrow-right transition-transform group-hover:translate-x-1"></i>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectRecruitment(item) {
            const slugTitle = item.title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)/g, '');
            const newPath = `/${item.id}/${item.createdAt}/${slugTitle}`;
            window.history.pushState({}, '', newPath);
            openFormView(item, true);
        }

        function openFormView(item, animate = true) {
            activeRecruitment = item;
            document.getElementById('recruitment-list-view').classList.add('hidden');
            document.getElementById('recruitment-form-view').classList.remove('hidden');

            const headerArea = document.getElementById('form-header-area');
            headerArea.innerHTML = `
                <h2 class="text-2xl md:text-3xl font-extrabold mb-2">${item.title}</h2>
                <p class="text-sm text-zinc-600 dark:text-zinc-400">${item.description}</p>
            `;

            const sysArea = document.getElementById('system-fields-area');
            sysArea.innerHTML = '<h4 class="text-sm font-bold uppercase tracking-wider text-brandRed mb-3">Informacje Kontaktowe</h4>';
            
            if (item.collectEmail) {
                sysArea.innerHTML += `
                    <div>
                        <label class="block text-sm font-medium mb-1">Adres E-mail <span class="text-brandRed">*</span></label>
                        <input type="email5" name="sys_email" required class="w-full bg-black/5 dark:bg-white/5 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition" placeholder="nazwa@domena.pl">
                    </div>
                `;
            }
            if (item.collectDiscord) {
                sysArea.innerHTML += `
                    <div>
                        <label class="block text-sm font-medium mb-1">Nazwa użytkownika Discord <span class="text-brandRed">*</span></label>
                        <input type="text" name="sys_discord" required class="w-full bg-black/5 dark:bg-white/5 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition" placeholder="np. nick#0000 lub @nazwa">
                    </div>
                `;
            }
            if (item.collectRoblox) {
                sysArea.innerHTML += `
                    <div>
                        <label class="block text-sm font-medium mb-1">Nick w Roblox <span class="text-brandRed">*</span></label>
                        <input type="text" name="sys_roblox" required class="w-full bg-black/5 dark:bg-white/5 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition" placeholder="Twój dokładny nick Roblox">
                    </div>
                `;
            }

            const qArea = document.getElementById('questions-area');
            qArea.innerHTML = '<h4 class="text-sm font-bold uppercase tracking-wider text-brandRed mb-3 pt-2">Kwestionariusz Rekrutacyjny</h4>';

            item.questions.forEach((q, index) => {
                let qHtml = `<div class="space-y-2"><label class="block text-sm font-medium">${index + 1}. ${q.title}</label>`;
                
                if (q.type === 'short') {
                    qHtml += `<input type="text" name="${q.id}" ${q.required !== false ? 'required' : ''} class="w-full bg-black/5 dark:bg-white/5 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition" placeholder="Twoja odpowiedź...">`;
                } else if (q.type === 'long') {
                    qHtml += `<textarea name="${q.id}" rows="4" ${q.required !== false ? 'required' : ''} class="w-full bg-black/5 dark:bg-white/5 border border-zinc-300 dark:border-zinc-700 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-brandRed transition" placeholder="Twoja rozbudowana odpowiedź..."></textarea>`;
                } else if (q.type === 'choice') {
                    qHtml += `<div class="grid grid-cols-1 sm:grid-cols-2 gap-2 pt-1">`;
                    q.options.forEach((opt, oIdx) => {
                        qHtml += `
                            <label class="flex items-center gap-3 p-3 rounded-xl border border-zinc-200 dark:border-zinc-800 bg-black/5 dark:bg-white/5 cursor-pointer hover:border-brandRed transition">
                                <input type="radio" name="${q.id}" value="${opt}" ${oIdx === 0 ? 'required' : ''} class="accent-brandRed">
                                <span class="text-sm">${opt}</span>
                            </label>
                        `;
                    });
                    qHtml += `</div>`;
                } else if (q.type === 'slider') {
                    const min = q.min || 1;
                    const max = q.max || 10;
                    qHtml += `
                        <div class="flex items-center gap-4 pt-2">
                            <span class="text-xs font-bold text-zinc-500">${min}</span>
                            <input type="range" name="${q.id}" min="${min}" max="${max}" value="${Math.floor((max+min)/2)}" oninput="this.nextElementSibling.value = this.value" class="w-full accent-brandRed cursor-pointer">
                            <output class="text-sm font-bold text-brandRed w-6 text-center">${Math.floor((max+min)/2)}</output>
                            <span class="text-xs font-bold text-zinc-500">${max}</span>
                        </div>
                    `;
                } else if (q.type === 'file') {
                    qHtml += `
                        <input type="file" name="${q.id}" ${q.required !== false ? 'required' : ''} accept=".jpg,.jpeg,.png,.webp,.pdf,.zip" class="w-full text-sm text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-brandRed file:text-white hover:file:bg-brandRedHover file:cursor-pointer transition">
                    `;
                }
                qHtml += `</div>`;
                qArea.innerHTML += qHtml;
            });

            if (animate) {
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function backToList() {
            showListView(true);
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            
            const overlay = document.getElementById('bus-overlay');
            overlay.classList.remove('fade-out');
            
            try {
                let userEmail = formData.get('sys_email') || 'brak@email.pl';
                let robloxUser = formData.get('sys_roblox') || 'Brak';
                let discordUser = formData.get('sys_discord') || 'Brak';
                let ticketId = 'L' + Math.floor(100000 + Math.random() * 900000);

                let answersSummary = [];
                let filesToUpload = [];

                for (let [key, value] of formData.entries()) {
                    if (key.startsWith('sys_')) continue;
                    if (value instanceof File && value.size > 0) {
                        filesToUpload.push({ name: value.name, file: value });
                        answersSummary.push(`**${key}**: [Załączony plik: ${value.name}]`);
                    } else {
                        answersSummary.push(`**${key}**: ${value}`);
                    }
                }

                const brevoKey = window.LIW_CONFIG.brevoKeyPart1 + window.LIW_CONFIG.brevoKeyPart2;
                if (window.LIW_CONFIG.collectEmail && userEmail) {
                    const emailPayload = {
                        templateId: window.LIW_CONFIG.brevoTemplateId,
                        to: [{ email: userEmail }],
                        params: {
                            ROBLOX_USER: robloxUser,
                            RECRUITMENT_TITLE: activeRecruitment.title,
                            TICKET_ID: ticketId
                        }
                    };
                    
                    await fetch('https://api.brevo.com/v3/smtp/email', {
                        method: 'POST',
                        headers: {
                            'accept': 'application/json',
                            'api-key': brevoKey,
                            'content-type': 'application/json'
                        },
                        body: JSON.stringify(emailPayload)
                    }).catch(err => console.log('Brevo error:', err));
                }

                const discordUrl = window.LIW_CONFIG.discordPart1 + window.LIW_CONFIG.discordPart2;
                const discordFormData = new FormData();
                
                const embedContent = {
                    title: `📥 Nowe zgłoszenie: ${activeRecruitment.title}`,
                    color: 16724301,
                    fields: [
                        { name: "ID Zgłoszenia", value: ticketId, inline: true },
                        { name: "Roblox", value: robloxUser, inline: true },
                        { name: "Discord", value: discordUser, inline: true },
                        { name: "Odpowiedzi", value: answersSummary.join('\n') || 'Brak odpowiedzi' }
                    ],
                    timestamp: new Date().toISOString()
                };

                discordFormData.append('payload_json', JSON.stringify({ embeds: [embedContent] }));
                
                filesToUpload.forEach((fObj, idx) => {
                    discordFormData.append(`file${idx}`, fObj.file, fObj.name);
                });

                await fetch(discordUrl, {
                    method: 'POST',
                    body: discordFormData
                }).catch(err => console.log('Discord error:', err));

                overlay.classList.add('fade-out');
                showToast(`Zgłoszenie #${ticketId} zostało pomyślnie wysłane!`);
                setTimeout(() => showListView(true), 1500);

            } catch (error) {
                overlay.classList.add('fade-out');
                showToast('Wystąpił błąd podczas wysyłania zgłoszenia.', 'error');
            }
        }
    </script>
</body>
</html>
