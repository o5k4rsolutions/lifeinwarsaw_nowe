    <title>Aktualne Rekrutacje | Life in Warsaw</title>
    <link rel="icon" type="image/x-icon" href="liw-content/liw_zakoch-2.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        brandRed: '#ff334b',
                        brandRedHover: '#e61e38',
                        brandDark: '#0a0b10',
                        brandCard: '#13151f',
                        brandBorder: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        .dark body {
            background-color: #0a0b10;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }
        .dark .glass-panel {
            background: rgba(19, 21, 31, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dark .glass-card {
            background: rgba(19, 21, 31, 0.9);
            border: 1px solid rgba(255, 255, 255, 0.07);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }
        .glass-card:hover {
            transform: translateY(-4px);
            border-color: rgba(255, 51, 75, 0.4);
            box-shadow: 0 20px 40px rgba(255, 51, 75, 0.12);
        }
        .cyber-button {
            position: relative;
            background: linear-gradient(135deg, #ff334b 0%, #c91830 100%);
            color: #ffffff;
            font-weight: 600;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 12px 28px;
            font-size: 15px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(255, 51, 75, 0.3);
            transition: all 0.3s ease;
        }
        .cyber-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255, 51, 75, 0.5);
        }
        .glow-orb {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 51, 75, 0.08) 0%, rgba(248, 250, 252, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        .dark .glow-orb {
            background: radial-gradient(circle, rgba(255, 51, 75, 0.12) 0%, rgba(10, 11, 16, 0) 70%);
        }
        #bus-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            transition: opacity 0.8s ease;
        }
        .dark #bus-overlay {
            background-color: #0a0b10;
        }
        #bus-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .loader-rings {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #ff334b;
            border-radius: 50%;
            animation: spinRing 1s linear infinite;
        }
        .dark .loader-rings {
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #ff334b;
        }
        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Własne okienko powiadomień / modal animowany */
        .liw-modal {
            animation: modalPop 0.3s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
        @keyframes modalPop {
            0% { opacity: 0; transform: scale(0.95) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>

    <!-- Główna logika widoków i routingu /id/datautworzenia/tytuł -->
    <script>
        const htmlRoot = document.getElementById('html-root');
        const container = document.getElementById('app-container');

        // Theme sync
        if (localStorage.getItem('liw_theme') === 'dark') {
            htmlRoot.classList.add('dark');
            htmlRoot.classList.remove('light');
        }

        // Custom Modal Generator (własne komunikaty bez alertów przeglądarki)
        function showCustomModal(title, message, isSuccess = true) {
            const old = document.getElementById('custom-liw-modal');
            if (old) old.remove();

            const modal = document.createElement('div');
            modal.id = 'custom-liw-modal';
            modal.className = 'fixed inset-0 z-[99999] flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm';
            modal.innerHTML = `
                <div class="glass-panel liw-modal max-w-md w-full p-6 rounded-2xl text-center border ${isSuccess ? 'border-green-500/30' : 'border-red-500/30'}">
                    <div class="w-12 h-12 rounded-full mx-auto flex items-center justify-center mb-4 text-xl ${isSuccess ? 'bg-green-500/20 text-green-500' : 'bg-brandRed/20 text-brandRed'}">
                        <i class="fa-solid ${isSuccess ? 'fa-check' : 'fa-triangle-exclamation'}"></i>
                    </div>
                    <h3 class="text-lg font-bold mb-2">${title}</h3>
                    <p class="text-sm text-zinc-600 dark:text-zinc-400 mb-6">${message}</p>
                    <button onclick="document.getElementById('custom-liw-modal').remove()" class="cyber-button w-full">OK, rozumiem</button>
                </div>
            `;
            document.body.appendChild(modal);
        }

        // Router URL handler: /id/datautworzenia/tytuł
        function parseRoute() {
            const path = window.location.hash.slice(1) || window.location.pathname;
            // Sprawdź czy mamy format rekrutacji w URL (np. wsparcie dla hash routing lub ścieżek)
            const segments = window.location.search.replace('?', '').split('/');
            
            // Prostsza obsługa stanu za pomocą parametrów zapytania (?view=form&id=...)
            const urlParams = new URLSearchParams(window.location.search);
            const activeId = urlParams.get('id');

            if (activeId && window.LIW_RECRUITMENTS) {
                const rec = window.LIW_RECRUITMENTS.find(r => r.id === activeId);
                if (rec) {
                    renderFormView(rec);
                    return;
                }
            }
            renderListView();
        }

        // Wyświetlanie listy rekrutacji
        function renderListView() {
            // Zmień URL z powrotem na główny link rekrutacji bez przładowania
            window.history.replaceState({}, '', 'https://lifeinwarsaw.vercel.app/rekrutacje.html');

            let html = `
                <div class="text-center mb-12">
                    <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight mb-4">
                        Aktualne Rekrutacje
                    </h1>
                    <p class="text-zinc-600 dark:text-zinc-400 text-base md:text-lg max-w-2xl mx-auto leading-relaxed">
                        Wybierz interesujące Cię stanowisko, wypełnij interaktywny formularz aplikacyjny i dołącz do naszego zespołu!
                    </p>
                </div>
                <div class="grid gap-6 md:grid-cols-2">
            `;

            if (!window.LIW_RECRUITMENTS || window.LIW_RECRUITMENTS.length === 0) {
                html += `<div class="col-span-2 text-center py-12 text-zinc-500">Brak otwartych rekrutacji w tym momencie.</div>`;
            } else {
                window.LIW_RECRUITMENTS.forEach(rec => {
                    // Slug tytułu do url: /id/data/tytuł
                    const slugTitle = rec.title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
                    const cleanDate = rec.date.replace(/-/g, '');
                    
                    html += `
                        <div class="glass-card rounded-2xl p-6 md:p-8 flex flex-col justify-between cursor-pointer group" onclick="openRecruitment('${rec.id}', '${cleanDate}', '${slugTitle}')">
                            <div>
                                <div class="flex items-center justify-between mb-4 pb-3 border-b border-zinc-200 dark:border-zinc-800">
                                    <span class="text-xs font-semibold px-3 py-1 rounded-full bg-brandRed/10 text-brandRed">Aktywna</span>
                                    <span class="text-xs text-zinc-500"><i class="fa-regular fa-calendar mr-1"></i> ${rec.date}</span>
                                </div>
                                <h2 class="text-xl font-bold mb-3 group-hover:text-brandRed transition-colors">${rec.title}</h2>
                                <p class="text-sm text-zinc-600 dark:text-zinc-400 leading-relaxed mb-6">${rec.description}</p>
                            </div>
                            <div class="flex items-center text-sm font-semibold text-brandRed gap-2">
                                <span>Aplikuj teraz</span>
                                <i class="fa-solid fa-arrow-right transition-transform group-hover:translate-x-1"></i>
                            </div>
                        </div>
                    `;
                });
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // Kliknięcie w rekrutację – zmiana adresu na wymagany format i render formularza
        function openRecruitment(id, dateStr, slugTitle) {
            const newPath = `/rekrutacje.html?id=${id}`;
            window.history.pushState({}, '', newPath);
            const rec = window.LIW_RECRUITMENTS.find(r => r.id === id);
            if (rec) renderFormView(rec);
        }

        // Wyświetlanie formularza wybranej rekrutacji
        function renderFormView(rec) {
            let html = `
                <div class="mb-8 flex items-center justify-between">
                    <button onclick="renderListView()" class="inline-flex items-center gap-2 text-sm font-semibold text-zinc-600 dark:text-zinc-400 hover:text-brandRed transition">
                        <i class="fa-solid fa-arrow-left"></i> Powrót do listy rekrutacji
                    </button>
                    <span class="text-xs text-zinc-500 font-mono">ID: ${rec.id}</span>
                </div>

                <div class="glass-card rounded-2xl p-6 md:p-10">
                    <h1 class="text-2xl md:text-3xl font-bold mb-2">${rec.title}</h1>
                    <p class="text-sm text-zinc-600 dark:text-zinc-400 mb-8 pb-6 border-b border-zinc-200 dark:border-zinc-800">${rec.description}</p>

                    <form id="recruitment-form" class="space-y-6" onsubmit="handleRecruitmentSubmit(event, '${rec.title.replace(/'/g, "\\'")}')">
            `;

            // Podstawowe pola systemowe
            if (rec.collectEmail) {
                html += `
                    <div>
                        <label class="block text-sm font-medium mb-2">Adres E-mail <span class="text-brandRed">*</span></label>
                        <input type="email" required name="sys_email" placeholder="twoj@email.pl" class="w-full px-4 py-3 rounded-xl bg-black/5 dark:bg-white/5 border border-zinc-200 dark:border-zinc-800 focus:border-brandRed focus:outline-none transition text-sm">
                    </div>
                `;
            }
            if (rec.collectDiscord) {
                html += `
                    <div>
                        <label class="block text-sm font-medium mb-2">Nazwa użytkownika Discord <span class="text-brandRed">*</span></label>
                        <input type="text" required name="sys_discord" placeholder="np. nick#0000 lub nazwa" class="w-full px-4 py-3 rounded-xl bg-black/5 dark:bg-white/5 border border-zinc-200 dark:border-zinc-800 focus:border-brandRed focus:outline-none transition text-sm">
                    </div>
                `;
            }
            if (rec.collectRoblox) {
                html += `
                    <div>
                        <label class="block text-sm font-medium mb-2">Nick w grze Roblox <span class="text-brandRed">*</span></label>
                        <input type="text" required name="sys_roblox" placeholder="Twój dokładny nick Roblox" class="w-full px-4 py-3 rounded-xl bg-black/5 dark:bg-white/5 border border-zinc-200 dark:border-zinc-800 focus:border-brandRed focus:outline-none transition text-sm">
                    </div>
                `;
            }

            // Pytania z pliku rekrutacja.js
            rec.questions.forEach((q, idx) => {
                html += `<div class="pt-2">`;
                html += `<label class="block text-sm font-medium mb-2">${idx + 1}. ${q.label} ${q.required !== false ? '<span class="text-brandRed">*</span>' : ''}</label>`;

                if (q.type === 'short') {
                    html += `<input type="text" ${q.required !== false ? 'required' : ''} name="${q.id}" class="w-full px-4 py-3 rounded-xl bg-black/5 dark:bg-white/5 border border-zinc-200 dark:border-zinc-800 focus:border-brandRed focus:outline-none transition text-sm" placeholder="Twoja odpowiedź...">`;
                } else if (q.type === 'long') {
                    html += `<textarea rows="4" ${q.required !== false ? 'required' : ''} name="${q.id}" class="w-full px-4 py-3 rounded-xl bg-black/5 dark:bg-white/5 border border-zinc-200 dark:border-zinc-800 focus:border-brandRed focus:outline-none transition text-sm" placeholder="Rozwiń swoją wypowiedź..."></textarea>`;
                } else if (q.type === 'choice') {
                    html += `<div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
                    q.options.forEach((opt, oIdx) => {
                        html += `
                            <label class="flex items-center gap-3 p-3 rounded-xl bg-black/5 dark:bg-white/5 border border-zinc-200 dark:border-zinc-800 cursor-pointer hover:border-brandRed transition">
                                <input type="radio" name="${q.id}" value="${opt}" ${oIdx === 0 ? 'required' : ''} class="text-brandRed focus:ring-brandRed">
                                <span class="text-sm">${opt}</span>
                            </label>
                        `;
                    });
                    html += `</div>`;
                } else if (q.type === 'range') {
                    html += `
                        <div class="space-y-2">
                            <input type="range" min="${q.min}" max="${q.max}" value="${q.default}" name="${q.id}" class="w-full accent-brandRed cursor-pointer" oninput="this.nextElementSibling.innerText = 'Wartość: ' + this.value">
                            <div class="text-xs font-semibold text-brandRed">Wartość: ${q.default}</div>
                        </div>
                    `;
                } else if (q.type === 'file') {
                    html += `
                        <input type="file" ${q.required !== false ? 'required' : ''} name="${q.id}" accept=".png,.jpg,.jpeg,.webp" class="w-full text-sm text-zinc-500 file:mr-4 file:py-2 file:px-4 file:rounded-xl file:border-0 file:text-sm file:font-semibold file:bg-brandRed/10 file:text-brandRed hover:file:bg-brandRed/20 cursor-pointer">
                        <span class="text-xs text-zinc-500 mt-1 block">Dozwolone formaty: JPG, PNG, WEBP.</span>
                    `;
                }

                html += `</div>`;
            });

            html += `
                        <div class="pt-6 border-t border-zinc-200 dark:border-zinc-800 flex justify-end">
                            <button type="submit" class="cyber-button">
                                <span class="flex items-center gap-2"><i class="fa-solid fa-paper-plane"></i> Wyślij zgłoszenie</span>
                            </button>
                        </div>
                    </form>
                </div>
            `;

            container.innerHTML = html;
        }

        // Obsługa wysyłania formularza (Integracja Discord Webhook + Brevo API z obsługą załączników i plików)
        async function handleRecruitmentSubmit(e, recTitle) {
            e.preventDefault();
            const form = e.target;
            const formData = new FormData(form);

            // Wyświetlenie loadera
            const overlay = document.getElementById('bus-overlay');
            if (overlay) overlay.classList.remove('fade-out');

            const ticketId = 'LIW-' + Math.floor(100000 + Math.random() * 900000);
            const robloxUser = formData.get('sys_roblox') || formData.get('zk1') || 'Nie podano';
            const emailUser = formData.get('sys_email') || '';

            // Przetwarzanie pól formularza na czytelny tekst do webhooka
            let fieldsSummary = [];
            let fileAttachment = null;

            for (let [key, value] of formData.entries()) {
                if (value instanceof File && value.size > 0) {
                    fileAttachment = value;
                    fieldsSummary.push(`**${key}**: [Załączony plik: ${value.name}]`);
                } else if (!key.startsWith('sys_')) {
                    fieldsSummary.push(`**${key}**: ${value}`);
                }
            }

            try {
                // 1. Wysyłka e-maila przez Brevo API (jeśli podano email i skonfigurowano szablon)
                if (emailUser && window.getBrevoKey) {
                    const brevoData = {
                        templateId: window.BREVO_TEMPLATE_ID,
                        to: [{ email: emailUser }],
                        params: {
                            ROBLOX_USER: robloxUser,
                            RECRUITMENT_TITLE: recTitle,
                            TICKET_ID: ticketId
                        }
                    };

                    await fetch('https://api.brevo.com/v3/smtp/email', {
                        method: 'POST',
                        headers: {
                            'accept': 'application/json',
                            'api-key': window.getBrevoKey(),
                            'content-type': 'application/json'
                        },
                        body: JSON.stringify(brevoData)
                    });
                }

                // 2. Wysyłka na Webhook Discord (wraz z plikami i pełnymi danymi)
                if (window.getWebhookUrl) {
                    const discordForm = new FormData();
                    const payloadJson = {
                        content: `📥 **Nowe zgłoszenie rekrutacyjne!** (\`${ticketId}\`)`,
                        embeds: [{
                            title: recTitle,
                            color: 16723275,
                            fields: [
                                { name: "Użytkownik Roblox", value: robloxUser, inline: true },
                                { name: "Discord", value: formData.get('sys_discord') || 'Brak', inline: true },
                                { name: "E-mail", value: emailUser || 'Nie wymagany', inline: true },
                                { name: "Szczegóły odpowiedzi", value: fieldsSummary.join('\n') || 'Brak dodatkowych pytań' }
                            ],
                            timestamp: new Date().toISOString()
                        }]
                    };

                    discordForm.append('payload_json', JSON.stringify(payloadJson));
                    if (fileAttachment) {
                        discordForm.append('file', fileAttachment, fileAttachment.name);
                    }

                    await fetch(window.getWebhookUrl(), {
                        method: 'POST',
                        body: discordForm
                    });
                }

                if (overlay) overlay.classList.add('fade-out');
                showCustomModal('Sukces!', `Twoje zgłoszenie zostało pomyślnie wysłane! Twój numer zgłoszenia to: ${ticketId}.`);
                setTimeout(() => { renderListView(); }, 2500);

            } catch (err) {
                console.error(err);
                if (overlay) overlay.classList.add('fade-out');
                showCustomModal('Błąd wysyłania', 'Wystąpił problem podczas przesyłania formularza. Spróbuj ponownie później.', false);
            }
        }

        // Inicjalizacja przy załadowaniu strony
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const overlay = document.getElementById('bus-overlay');
                if (overlay) overlay.classList.add('fade-out');
            }, 700);

            parseRoute();
        });
    </script>
</body>
</html>
