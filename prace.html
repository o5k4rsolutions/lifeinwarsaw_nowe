<!DOCTYPE html>
<html lang="pl" id="html-root" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prace nad serwisem – Wszystko o TRAMsporcie & Life in Warsaw</title>
    <link rel="icon" type="image/x-icon" href="liw-content/liw_zakoch-2.svg">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        'sans': ['Outfit', '-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'sans-serif'],
                        'heading': ['Outfit', '-apple-system', 'BlinkMacSystemFont', '"SF Pro Display"', 'sans-serif']
                    },
                    colors: {
                        brandRed: '#ff334b',
                        brandRedHover: '#e61e38',
                        brandDark: '#0a0b10',
                        brandCard: '#ffffff',
                        brandBorder: 'rgba(0, 0, 0, 0.08)'
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
            letter-spacing: -0.01em;
            background: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }
        h1, h2, h3, h4, h5, h6, .font-heading {
            letter-spacing: -0.022em;
        }
        .apple-hero-bg {
            background: linear-gradient(180deg, #ffffff 0%, #fff1f2 45%, #fef2f2 100%);
            position: relative;
            overflow: hidden;
        }
        .apple-halo {
            background: radial-gradient(circle at 50% 35%, rgba(255, 51, 75, 0.15) 0%, rgba(40, 110, 210, 0.08) 40%, transparent 75%);
            filter: blur(80px);
        }
        .glow-orb {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 51, 75, 0.1) 0%, rgba(248, 250, 252, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }
        #bus-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            transition: opacity 0.8s ease;
        }
        #bus-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }
        .loader-rings {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #ff334b;
            border-radius: 50%;
            animation: spinRing 1.1s linear infinite;
        }
        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        img {
            -webkit-user-drag: none;
            user-drag: none;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brandRed selection:text-white">

    <div id="bus-overlay">
        <div class="flex items-center gap-4">
            <img src="https://wszystko-o-tramsporcie.vercel.app/data/content/logo_nowe_.svg" alt="TRAMsport Logo" class="h-12 w-auto filter brightness-0 contrast-200">
            <span class="text-zinc-400 text-xl font-bold">+</span>
            <img src="https://liw-roblox.vercel.app/liw-content/image-3.svg" alt="Life in Warsaw Logo" class="h-12 w-auto filter brightness-0 contrast-200">
        </div>
        <div class="loader-rings"></div>
        <div class="text-xs font-semibold uppercase tracking-widest text-zinc-500 animate-pulse">Ładowanie...</div>
    </div>

    <header class="w-full sticky top-0 z-50 bg-gradient-to-r from-red-600 via-brandRed to-rose-600 shadow-lg border-b border-red-500/30">
        <div class="max-w-[1300px] mx-auto px-6 py-4 flex justify-center items-center">
            <div class="flex items-center gap-4">
                <img src="https://wszystko-o-tramsporcie.vercel.app/data/content/logo_nowe_.svg" alt="TRAMsport Logo" class="h-12 md:h-14 w-auto">
                <span class="text-white/80 text-lg font-light">×</span>
                <img src="https://liw-roblox.vercel.app/liw-content/image-3.svg" alt="Life in Warsaw Logo" class="h-12 md:h-14 w-auto filter brightness-200">
            </div>
        </div>
    </header>

    <main class="flex-grow relative apple-hero-bg flex items-center justify-center py-24">
        <div class="absolute inset-0 apple-halo pointer-events-none w-[700px] h-[700px] rounded-full left-1/2 top-1/2 -translate-x-1/2 -translate-y-1/2"></div>
        <div class="glow-orb top-10 left-10"></div>
        <div class="glow-orb bottom-10 right-10"></div>

        <div class="max-w-3xl mx-auto px-6 text-center relative z-10 space-y-8">
            <div class="space-y-4">
                <h1 class="font-heading text-4xl sm:text-6xl font-black tracking-tight leading-tight text-slate-900">
                    Pracujemy wspólnie nad tą częścią serwisu...
                </h1>
                <p class="text-base sm:text-lg text-zinc-600 max-w-xl mx-auto leading-relaxed font-normal">
                    Połączyliśmy siły projektów <strong class="text-slate-900">Wszystko o TRAMsporcie</strong> oraz </br> <strong class="text-slate-900">Life in Warsaw</strong>, aby dostarczyć Wam najlepsze doświadczenia...
                </p>
            </div>
        </div>
    </main>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const overlay = document.getElementById('bus-overlay');
                if (overlay) {
                    overlay.classList.add('fade-out');
                }
            }, 800);
        });

        document.addEventListener('contextmenu', function(e) {
            if (e.target.tagName === 'IMG') { e.preventDefault(); }
        });
    </script>
</body>
</html>
