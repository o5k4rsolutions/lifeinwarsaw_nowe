<!DOCTYPE html>
<html lang="pl" id="html-root" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Strona nie znaleziona | Life in Warsaw</title>
    <link rel="icon" type="image/x-icon" href="liw-content/liw_zakoch_black-2.png">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Outfit', 'sans-serif'],
                    },
                    colors: {
                        brandRed: '#ff334b',
                        brandRedHover: '#e61e38',
                        brandDark: '#0a0b10',
                        brandCard: '#13151f',
                        brandBorder: 'rgba(255, 255, 255, 0.08)',
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background-color: #f8fafc;
            color: #0f172a;
            overflow-x: hidden;
            transition: background-color 0.4s ease, color 0.4s ease;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.08);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.03);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .glass-card:hover {
            transform: translateY(-6px);
            border-color: rgba(255, 51, 75, 0.4);
            box-shadow: 0 20px 40px rgba(255, 51, 75, 0.12);
        }

        .cyber-button {
            position: relative;
            background: linear-gradient(135deg, #ff334b 0%, #c91830 100%);
            color: #ffffff;
            font-weight: 600;
            border-radius: 14px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 14px 32px;
            font-size: 15px;
            text-decoration: none;
            border: 1px solid rgba(255, 255, 255, 0.2);
            cursor: pointer;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(255, 51, 75, 0.3);
            transition: all 0.3s ease;
        }

        .cyber-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 35px rgba(255, 51, 75, 0.5);
        }

        .glow-orb {
            position: absolute;
            width: 450px;
            height: 450px;
            background: radial-gradient(circle, rgba(255, 51, 75, 0.08) 0%, rgba(248, 250, 252, 0) 70%);
            border-radius: 50%;
            z-index: 0;
            pointer-events: none;
        }

        #bus-overlay {
            position: fixed;
            inset: 0;
            z-index: 99999;
            background-color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            transition: opacity 0.8s ease;
        }
        #bus-overlay.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        .loader-rings {
            width: 60px;
            height: 60px;
            border: 3px solid rgba(0, 0, 0, 0.1);
            border-top: 3px solid #ff334b;
            border-radius: 50%;
            animation: spinRing 1s linear infinite;
        }

        @keyframes spinRing {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-brandRed selection:text-white">

    <div id="bus-overlay">
        <img id="overlay-logo" src="https://liw-roblox.vercel.app/liw-content/image-3.svg" 
             alt="Life in Warsaw Logo" 
             class="h-16 w-auto filter brightness-0 contrast-200"
             onerror="this.src='https://placehold.co/220x60/000000/ffffff?text=Life+in+Warsaw'">
        <div class="loader-rings"></div>
        <div class="text-xs font-semibold uppercase tracking-widest text-zinc-500 animate-pulse">Ładowanie...</div>
    </div>

    <header class="w-full sticky top-0 z-50 bg-gradient-to-r from-red-600 via-brandRed to-rose-600 shadow-lg border-b border-red-500/30">
        <div class="max-w-[1300px] mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="nav-link flex items-center group">
                <img src="https://liw-roblox.vercel.app/liw-content/image-3.svg" 
                     alt="Life in Warsaw Logo" 
                     class="h-12 md:h-14 w-auto transition-transform duration-300 group-hover:scale-105 filter brightness-200">
            </a>
            <div class="flex items-center gap-3 md:gap-4">
                <a href="https://lifeinwarsaw.vercel.app" class="nav-link text-xs md:text-sm font-semibold text-white/90 hover:text-white transition py-2 px-4 rounded-lg hover:bg-white/15">Strona główna</a>
            </div>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center relative py-20">
        <div class="glow-orb top-10 left-10"></div>
        <div class="glow-orb bottom-10 right-10"></div>

        <div class="max-w-2xl mx-auto px-6 text-center relative z-10">
            <h1 class="text-6xl md:text-8xl font-black text-slate-900 tracking-tight mb-4">
                404
            </h1>
            
            <h2 class="text-2xl md:text-3xl font-bold text-slate-800 mb-4">
                Wygląda na to, że ten autobus zjechał z trasy!
            </h2>
            
            <p class="text-zinc-600 text-base md:text-lg mb-10 max-w-md mx-auto leading-relaxed">
                Strona, której szukasz, nie istnieje, została przeniesiona lub została zlikwidowana.
            </p>

            <div class="flex flex-wrap justify-center gap-4">
                <a href="https://lifeinwarsaw.vercel.app" class="nav-link cyber-button group">
                    <span class="flex items-center gap-3"><i class="fa-solid fa-house"></i> Wróć na stronę główną <i class="fa-solid fa-arrow-right transition-transform group-hover:translate-x-1.5"></i></span>
                </a>
            </div>
        </div>
    </main>

    <footer class="bg-slate-100 text-zinc-500 py-6 text-xs border-t border-black/5">
        <div class="max-w-[1300px] mx-auto px-6 flex flex-col md:flex-row justify-between items-center text-center md:text-left gap-4">
            <p>&copy; 2026 Life in Warsaw. Wszelkie prawa zastrzeżone.</p>
            <p class="text-zinc-600">UWAGA! Ta strona nie jest oficjalną stroną WTP ani ZTM.</p>
        </div>
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            setTimeout(() => {
                const overlay = document.getElementById('bus-overlay');
                if (overlay) {
                    overlay.classList.add('fade-out');
                }
            }, 800);

            const links = document.querySelectorAll('a.nav-link');
            links.forEach(link => {
                link.addEventListener('click', function(e) {
                    const href = this.getAttribute('href');
                    const targetAttr = this.getAttribute('target');
                    
                    if (href && href !== '#' && !href.startsWith('#')) {
                        e.preventDefault();
                        const overlay = document.getElementById('bus-overlay');
                        if (overlay) {
                            overlay.classList.remove('fade-out');
                        }
                        
                        setTimeout(() => {
                            if (targetAttr === '_blank') {
                                window.open(href, '_blank');
                                if (overlay) overlay.classList.add('fade-out');
                            } else {
                                window.location.href = href;
                            }
                        }, 800);
                    }
                });
            });
        });
    </script>
</body>
</html>
